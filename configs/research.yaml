experiment_name: "AEGISMED: A PRIVACY-PRESERVING FEDERATED LEARNING FOR HETEROGENEOUS HOSPITAL NETWORKS"
seed: 42

dataset:
  num_classes: 4
  classes: ["Normal", "Lung_Opacity", "Viral Pneumonia", "COVID"]
  image_size: 128
  dirichlet_alpha: 0.3
  max_samples_per_class: 600   # ~2400 images total, perfectly balanced
  data_dir: "C:/Users/meghana/OneDrive/Desktop/major project/project/data/COVID-19_Radiography_Dataset"

federated:
  num_hospitals: 4
  hospital_names: ["Hospital_A_Metropolitan", "Hospital_B_Regional", "Hospital_C_University", "Hospital_D_Community"]
  num_rounds: 15
  local_epochs: 2
  batch_size: 16
  lr: 0.0005
  mu_prox: 0.01

model:
  backbone: "resnet18"
  pretrained: true
  num_classes: 4
  dropout: 0.3

privacy:
  enabled: true
  target_epsilon: 3.0
  target_delta: 0.0001
  max_grad_norm: 1.0
  noise_multiplier: 1.5

compression:
  enabled: true
  top_k_ratio: 0.20   # exactly 80% communication reduction

paths:
  checkpoints_dir: "checkpoints"
  results_dir: "results"
  figures_dir: "figures"
  reports_dir: "reports"
