[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-medical-privacy"
version = "1.0.0"
description = "Communication-Efficient Federated Learning with Differential Privacy Guarantees for Distributed Image Classification Across Heterogeneous Hospital Networks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "flwr>=1.4.0",
    "opacus>=1.4.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pillow>=9.5.0",
    "scipy>=1.10.0",
    "tabulate>=0.9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
